# Run the dashboard so it monitors the host machine.
#
#   docker compose up -d --build
#
# Notes on why the host namespaces and mounts are needed are inline below.

services:
  dashboard:
    build: .
    image: openclaw-dashboard
    container_name: openclaw-dashboard
    restart: unless-stopped

    # Host network: see the real interfaces (eth0/ens3), let ping reach the
    # internet, and bind :8080 directly on the host.
    network_mode: host

    # Host PID namespace so `ps` lists the server's processes, not just PID 1.
    pid: host

    environment:
      DASHBOARD_USERS: hermes,openclaw
      DASHBOARD_TZ: America/El_Salvador
      # Report the host's disk, mounted read-only at /host below, not the overlay fs.
      DASHBOARD_DISK_PATH: /host
      # Override the default login password (sha256 of your password):
      #   echo -n 'your-password' | sha256sum
      # DASHBOARD_PASSWORD_HASH: "..."

    volumes:
      # Persist the SQLite metrics DB and the session secret across restarts.
      - dashboard-data:/var/lib/openclaw-dashboard

      # Each monitored user's openclaw workspace (cron jobs, memories, issues, keys).
      - /home/hermes/.openclaw:/home/hermes/.openclaw:ro
      - /home/openclaw/.openclaw:/home/openclaw/.openclaw:ro

      # Login history for the "Security & Logins" panel (`last` / `who`).
      - /var/log/wtmp:/var/log/wtmp:ro
      - /var/run/utmp:/var/run/utmp:ro

      # Host root filesystem, read-only, for accurate disk usage (DASHBOARD_DISK_PATH).
      - /:/host:ro

volumes:
  dashboard-data:
